name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check . --ignore-path .gitignore --ignore-path .prettierignore

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check generated barrels are committed
        run: git diff --exit-code operators/

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Build React package
        run: npm run build --workspace=packages/react

      - name: Smoke test the packed package
        run: |
          npm pack --silent
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/zerobertoo-r6operators-*.tgz >/dev/null
          node -e "const r=require('@zerobertoo/r6operators');if(!r.ace.toSVG().startsWith('<svg'))process.exit(1)"
          node --input-type=module -e "import { ace } from '@zerobertoo/r6operators';if(ace.id!=='ace')process.exit(1)"
