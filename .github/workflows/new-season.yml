name: New Season Reminder

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season code (e.g. Y11S2)"
        required: true
      season_name:
        description: "Operation name (e.g. Operation Steel Wave)"
        required: true

jobs:
  open-season-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Resolve season info
        id: info
        env:
          SEASON: ${{ github.event.inputs.season }}
          SEASON_NAME: ${{ github.event.inputs.season_name }}
        run: |
          [[ "$SEASON" =~ ^Y[0-9]+S[1-4]$ ]] || { echo "invalid season: $SEASON"; exit 1; }
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "name=$SEASON_NAME" >> "$GITHUB_OUTPUT"

      - name: Open season checklist issue
        uses: actions/github-script@v7
        env:
          SEASON: ${{ steps.info.outputs.season }}
          SEASON_NAME: ${{ steps.info.outputs.name }}
        with:
          script: |
            const season = process.env.SEASON;
            const name   = process.env.SEASON_NAME;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[Season] Add ${season} operators: ${name}`,
              labels: ["new-operator", "season"],
              body: [
                `## ${season}: ${name}`,
                "",
                "A new Rainbow Six: Siege season has launched. Complete the checklist below to keep the package up to date.",
                "",
                "### Checklist",
                "",
                "- [ ] Identify new operators from the official patch notes",
                "- [ ] Create `operators/<name>/` directory with `<name>.svg` and `index.ts`",
                "- [ ] Fill in all `IOperator` fields (name, role, org, squad, ratings, meta, bio)",
                "- [ ] Set `season` to `\"" + season + "\"`",
                "- [ ] Update `CURRENT_SEASON` in `scripts/config.ts` to `\"" + season + "\"`",
                "- [ ] Run `npm run build` and verify the new operator appears in `dist/`",
                "- [ ] Run `npm run test`, all tests pass",
                "- [ ] Open a PR with title `feat(operators): add <name> (${season})`",
                "- [ ] After merge, bump the version and trigger the `publish` workflow",
                "",
                "Trigger the `New Season Reminder` workflow again when the next season launches.",
              ].join("\n"),
            });
